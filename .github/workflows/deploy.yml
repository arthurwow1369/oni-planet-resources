name: Deploy to Cloudflare Pages

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_type == 'branch' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Select isolated deployment target
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            printf '%s\n' 'DEPLOY_STAGE=prod' 'CF_PAGES_PROJECT=oni-planet-resources-prod' >> "$GITHUB_ENV"
          else
            printf '%s\n' 'DEPLOY_STAGE=dev' 'CF_PAGES_PROJECT=oni-planet-resources-dev' >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm test
          npm run lint

      - name: Build exact subpath artifact
        run: npm run build

      - name: Configure Pages project and dev Access policy
        run: node scripts/configure_cloudflare.mjs bootstrap "$DEPLOY_STAGE"
        env:
          CLOUDFLARE_ACCESS_EMAIL: ${{ secrets.CLOUDFLARE_ACCESS_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: Deploy Pages artifact
        run: >-
          npx --yes wrangler@4.118.0 pages deploy dist
          --project-name="$CF_PAGES_PROJECT"
          --branch="$GITHUB_REF_NAME"
          --commit-hash="$GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Configure and verify custom domain
        run: node scripts/configure_cloudflare.mjs finalize "$DEPLOY_STAGE"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
